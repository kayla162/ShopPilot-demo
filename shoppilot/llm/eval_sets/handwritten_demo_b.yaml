#
# 為什麼有 A、B 兩組：口語題 A（handwritten_demo.yaml）看過 v1、v2 答錯的題目之後，v3 的訓練資料是照那些錯誤改的，
# A 就不再是沒看過的題目（變成開發集）。B 是之後才寫的最終測試：商品、問法都和 A 不同，只在最後評估時跑一次。
