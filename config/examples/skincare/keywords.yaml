# 通用詞：會抽出來做關鍵字分析，但不放進搜尋關鍵字
generic: [溫和, 清爽, 滋潤, 熱門, 新版, 全新升級, 升級, 限定, 聯名]

# 商品描述：這個賣場的描述開頭是共用的正品說明、出貨須知，所以不用「切在共用段之前」，
# 改成拿掉出現在 30% 以上商品描述裡的行，剩下的才是這個商品自己的說明。
description:
  shared_marks: []
  shared_line_ratio: 0.3
  model_info: ''                                   # 保養品不需要模特兒身形，不檢查「缺身形參考」
  spec_examples: 不含共用的正品說明、出貨須知
  selling_points: 功效、主要成分、使用方式、適合膚質、容量與效期
  detail_info: 容量、效期
