# 標題與關鍵字規則：保養品賣場範例（保養品、髮品、彩妝為主，另有生活用品和少量服飾配件）。
# 用法：複製到 data/shops/<賣場名稱>/config/，再依自己的商品調整類別、品牌和屬性詞。
# 改完存檔，Dashboard 重新整理就會套用。

# 標記樣式（正規表示式）：用來計算「標記占比」，也會從核心標題移除。順序固定，會影響比對結果。
# 和服飾賣場不同：【品牌】不當成標記。保養品的品牌就是主要的搜尋詞，要留在核心標題、也放進屬性詞。
title_markers:
  - '#\S+'
  - '【闆娘自留款】'
  - '【\s*】'
  - '[AB]\d{4}'
  - '效期\s*到?\s*[-–:：]?\s*\d{4}\s*[/.]?\s*\d{0,2}'
  - '台灣公司貨'
  - '長效期'
  - '可集點'
  - '免運速寄'
  - '免運'
  - '速寄'
  - '全新現貨'
  - '現貨'
  - '全新'
  - '⚡'
  - '🚛'
  - '✨'
  - '💗'

# 行銷語（一般文字）：只從核心標題移除，不算進標記占比
marketing_phrases:
  - '限時限量特價!'
  - '限時限量特價'
  - '精挑選品'
  - '親膚材質'

# 類別：依序比對核心標題，第一個對到的就是類別（順序很重要：例如「頭皮精華」要先算髮品、「潔顏油」要先算卸妝潔顏）
