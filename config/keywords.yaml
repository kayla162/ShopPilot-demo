# 通用詞：會抽出來做關鍵字分析，但不放進搜尋關鍵字
generic: [百搭, 氣質, 質感, 舒適, 素面, 純色, 設計感]

# 商品描述的規則和建議用字（依品類調整；其他賣場可以在自己的 config/keywords.yaml 改，例如保養品）
description:
  shared_marks: ['🎉每樣商品', '📌下單須知📌']   # 描述裡各商品共用段的開頭，前面才是這個商品自己的說明
  shared_line_ratio: null                        # 數字（例如 0.3）：出現在這個比例以上商品描述裡的行，當成共用文字拿掉
  model_info: '身高|體重|模特'                   # 「缺身形參考」要找的字（正規表示式）；留空 '' 就不檢查這條
  spec_examples: 顏色、材質、尺寸                # 「描述只有規格」證據裡的說明
  selling_points: 穿搭情境、版型特色、材質觸感   # 「描述只有規格」建議補上的賣點
  detail_info: 尺寸資訊                          # 「高點擊零成交」「看了不加購」建議檢查的資訊；留空就不提
