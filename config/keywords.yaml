  - name: 配件
    keywords: [髮飾, 飾品, 帽]
  - name: 套裝
    keywords: [套裝, 2件組, 3件組, 兩件套, SET組, 件組]
  - name: 洋裝
    keywords: [洋裝, 連身裙, 連衣裙, 連身長褲, 背心裙, 吊帶裙, 洋]
  - name: 褲裙
    keywords: [褲裙]
  - name: 短褲
    keywords: [短褲]
  - name: 長褲
    keywords: [長褲, 牛仔褲, 闊腿, 寬褲, 彎刀褲]
  - name: 長裙
    keywords: [長裙, 魚尾裙]
  - name: 短裙
    keywords: [短裙, 片裙, 百褶裙, 蛋糕裙, 包臀針織裙]
  - name: 外套
    keywords: [外套, 夾克, 罩衫, 開衫, 披肩, 防曬衫]
  - name: 背心
    keywords: [背心, 馬甲, 小可愛, Bra Top, BraTop]
