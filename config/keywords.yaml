# 標題與關鍵字規則。改完存檔，Dashboard 重新整理就會套用。

# 標記樣式（正規表示式）：用來計算「標記占比」，也會從核心標題移除。順序固定，會影響比對結果。
title_markers:
  - '【[^】]*】'
  - '#\S+'
  - 'A\d{4}'
  - '🖤'
  - '現貨\+預購'
  - '現貨'
  - '預購'
  - '衝好評'
  - '數量有限'

# 行銷語（一般文字）：只從核心標題移除，不算進標記占比
marketing_phrases:
  - '激推!'
  - '激推！'
  - '天花板級的存在'
  - '實拍'

# 類別：依序比對核心標題，第一個對到的就是類別
categories:
